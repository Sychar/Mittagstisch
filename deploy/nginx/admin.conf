server {
    listen 80;
    listen [::]:80;
    server_name admin.deinedomain.de;

    root /var/www/mittagstisch/admin/current;
    index admin.html;

    location / {
        try_files $uri $uri/ /admin.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
