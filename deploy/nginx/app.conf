server {
    listen 80;
    listen [::]:80;
    server_name app.deinedomain.de;

    root /var/www/mittagstisch/app/current;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /_expo/static/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        try_files $uri =404;
    }
}
