services:
  db:
    image: postgres:16
    container_name: mittagstisch-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: mittagstisch_user
      POSTGRES_PASSWORD: mittagstisch_pass
      POSTGRES_DB: mittagstisch_dev
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: